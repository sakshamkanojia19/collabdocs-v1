name: Validate and Publish

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        run: npm ci
        working-directory: backend

      - name: Check backend syntax
        run: npm run check
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/collabdocs_ci
          JWT_ACCESS_SECRET: collabdocs-ci-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: collabdocs-ci-refresh-secret-at-least-32-characters
          FRONTEND_URL: http://localhost:5173
          KAFKA_BROKERS: ""

      - name: Test database and realtime workflows
        run: npm run test:db
        working-directory: backend
        env:
          RUN_DB_TESTS: "true"
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/collabdocs_ci
          MONGO_URI: mongodb://127.0.0.1:27017/collabdocs_ci
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_ACCESS_SECRET: collabdocs-ci-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: collabdocs-ci-refresh-secret-at-least-32-characters
          FRONTEND_URL: http://localhost:5173
          KAFKA_BROKERS: ""

      - name: Audit backend production dependencies
        run: npm audit --omit=dev
        working-directory: backend

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev
        working-directory: frontend

  publish-backend:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/collabdocs-backend:latest
            ghcr.io/${{ github.repository_owner }}/collabdocs-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
